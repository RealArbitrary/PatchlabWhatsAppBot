name: Deploy Patchlab WhatsApp Bot

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Stop service
        run: nssm stop PatchlabWhatsAppBot

      - name: Publish app
        run: dotnet publish -c Release -o C:\PatchlabWhatsAppBot\publish

      - name: Start service
        run: nssm start PatchlabWhatsAppBot
