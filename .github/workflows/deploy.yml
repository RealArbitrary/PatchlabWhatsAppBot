name: Deploy Patchlab WhatsApp Bot

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Stop PatchlabWhatsAppBot service
        run: C:\nssm\win64\nssm.exe stop PatchlabWhatsAppBot

      - name: Clean PatchlabWhatsAppBot publish folder
        run: |
          if (Test-Path "C:\PatchlabWhatsAppBot\publish") {
            Get-ChildItem "C:\PatchlabWhatsAppBot\publish" -Exclude config.json |
              Remove-Item -Recurse -Force
          }
        shell: powershell

      - name: Publish PatchlabWhatsAppBot
        run: dotnet publish -c Release -o C:\PatchlabWhatsAppBot\publish

      - name: Start PatchlabWhatsAppBot service
        shell: powershell
        run: |
          $serviceName = "PatchlabWhatsAppBot"

          try {
              & C:\nssm\win64\nssm.exe start $serviceName
          } catch {
              Write-Host "nssm start reported an error (expected if it raced SERVICE_START_PENDING): $_"
          }

          # nssm start checks status immediately after issuing the START control and can
          # see SERVICE_START_PENDING before the service finishes coming up, exiting 1 on
          # a service that's actually fine seconds later. Poll real status instead of
          # trusting that exit code.
          $timeoutSeconds = 60
          $intervalSeconds = 2
          $elapsed = 0
          $status = ""

          while ($elapsed -lt $timeoutSeconds) {
              $status = (& C:\nssm\win64\nssm.exe status $serviceName).Trim()
              Write-Host "$serviceName status: $status (${elapsed}s elapsed)"
              if ($status -eq "SERVICE_RUNNING") {
                  Write-Host "$serviceName reached SERVICE_RUNNING."
                  exit 0
              }
              Start-Sleep -Seconds $intervalSeconds
              $elapsed += $intervalSeconds
          }

          Write-Error "$serviceName did not reach SERVICE_RUNNING within $timeoutSeconds seconds (last status: $status)."
          exit 1

      - name: Stop PatchlabNgrokSync service
        run: C:\nssm\win64\nssm.exe stop PatchlabNgrokSync

      - name: Publish PatchlabNgrokSync
        run: dotnet publish PatchlabNgrokSync\PatchlabNgrokSync.csproj -c Release -o C:\PatchlabNgrokSync\publish

      - name: Start PatchlabNgrokSync service
        shell: powershell
        run: |
          $serviceName = "PatchlabNgrokSync"

          try {
              & C:\nssm\win64\nssm.exe start $serviceName
          } catch {
              Write-Host "nssm start reported an error (expected if it raced SERVICE_START_PENDING): $_"
          }

          # nssm start checks status immediately after issuing the START control and can
          # see SERVICE_START_PENDING before the service finishes coming up, exiting 1 on
          # a service that's actually fine seconds later. Poll real status instead of
          # trusting that exit code.
          $timeoutSeconds = 60
          $intervalSeconds = 2
          $elapsed = 0
          $status = ""

          while ($elapsed -lt $timeoutSeconds) {
              $status = (& C:\nssm\win64\nssm.exe status $serviceName).Trim()
              Write-Host "$serviceName status: $status (${elapsed}s elapsed)"
              if ($status -eq "SERVICE_RUNNING") {
                  Write-Host "$serviceName reached SERVICE_RUNNING."
                  exit 0
              }
              Start-Sleep -Seconds $intervalSeconds
              $elapsed += $intervalSeconds
          }

          Write-Error "$serviceName did not reach SERVICE_RUNNING within $timeoutSeconds seconds (last status: $status)."
          exit 1