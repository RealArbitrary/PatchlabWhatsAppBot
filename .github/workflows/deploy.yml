name: Deploy Patchlab WhatsApp Bot

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Stop PatchlabWhatsAppBot service
        run: C:\nssm\win64\nssm.exe stop PatchlabWhatsAppBot

      - name: Clean PatchlabWhatsAppBot publish folder
        run: |
          if (Test-Path "C:\PatchlabWhatsAppBot\publish") {
            Get-ChildItem "C:\PatchlabWhatsAppBot\publish" -Exclude config.json |
              Remove-Item -Recurse -Force
          }
        shell: powershell

      - name: Publish PatchlabWhatsAppBot
        run: dotnet publish -c Release -o C:\PatchlabWhatsAppBot\publish

      # --- new: apply EF Core migrations before the app starts on the new build ---
      - name: Install dotnet-ef tool
        run: |
          if (-not (Get-Command dotnet-ef -ErrorAction SilentlyContinue)) {
            dotnet tool install --global dotnet-ef
          }
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append
        shell: powershell

      - name: Apply database migrations
        run: dotnet ef database update --no-build --assembly "C:\PatchlabWhatsAppBot\publish\PatchlabWhatsAppBot.dll" --startup-assembly "C:\PatchlabWhatsAppBot\publish\PatchlabWhatsAppBot.dll" --connection "$env:PATCHLAB_DB_CONNECTION"
        shell: powershell
        env:
          PATCHLAB_DB_CONNECTION: ${{ secrets.PATCHLAB_DB_CONNECTION }}
      # --- end new ---

      - name: Start PatchlabWhatsAppBot service
        run: C:\nssm\win64\nssm.exe start PatchlabWhatsAppBot

      - name: Stop PatchlabNgrokSync service
        run: C:\nssm\win64\nssm.exe stop PatchlabNgrokSync

      - name: Publish PatchlabNgrokSync
        run: dotnet publish PatchlabNgrokSync\PatchlabNgrokSync.csproj -c Release -o C:\PatchlabNgrokSync\publish

      - name: Start PatchlabNgrokSync service
        run: C:\nssm\win64\nssm.exe start PatchlabNgrokSync